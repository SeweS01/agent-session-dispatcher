[project]
name = "agent-session-dispatcher"
version = "0.1.0"
description = "Owner-only Telegram dispatcher for named tmux agent sessions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "pydantic-settings>=2.7",
]

[project.scripts]
agent-session-dispatcher = "agent_session_dispatcher.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/agent_session_dispatcher/__main__.py" = ["RUF001"]
"src/agent_session_dispatcher/doctor.py" = ["RUF001"]
"src/agent_session_dispatcher/follower.py" = ["RUF001"]
"src/agent_session_dispatcher/input_delivery.py" = ["RUF001"]
"src/agent_session_dispatcher/setup_cli.py" = ["RUF001"]
"src/agent_session_dispatcher/telegram_app.py" = ["RUF001"]
"tests/test_input_delivery.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_session_dispatcher"]
